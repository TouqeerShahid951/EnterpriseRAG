x-fastembed-cache-volume: &fastembed-cache-volume
  type: bind
  source: ${FASTEMBED_CACHE_HOST_DIR:-./model-cache/fastembed}
  target: /models/fastembed

x-docling-cache-volume: &docling-cache-volume
  type: bind
  source: ${DOCLING_CACHE_HOST_DIR:-./model-cache/docling}
  target: /models/docling

x-vllm-cache-volume: &vllm-cache-volume
  type: bind
  source: ${VLLM_CACHE_HOST_DIR:-./model-cache/vllm}
  target: /models

x-folder-sources-volume: &folder-sources-volume
  type: bind
  source: ${FOLDER_SOURCES_HOST_DIR:-./folder-sources}
  target: ${FOLDER_SOURCES_ROOT:-/folder-sources}

x-artifact-env: &artifact-env
  ARTIFACT_COMPOSER_TIMEOUT_SECONDS: ${ARTIFACT_COMPOSER_TIMEOUT_SECONDS:-60}
  ARTIFACT_LIBREOFFICE_REQUIRED: ${ARTIFACT_LIBREOFFICE_REQUIRED:-false}
  ARTIFACT_MAINTENANCE_INTERVAL_SECONDS: ${ARTIFACT_MAINTENANCE_INTERVAL_SECONDS:-300}
  ARTIFACT_PIPELINE_VERSION: ${ARTIFACT_PIPELINE_VERSION:-v2}
  ARTIFACT_QUEUE_BACKEND: ${ARTIFACT_QUEUE_BACKEND:-celery}
  ARTIFACT_QUEUE_NAME: ${ARTIFACT_QUEUE_NAME:-artifact:jobs}
  ARTIFACT_RERANKER_MAX_CANDIDATES: ${ARTIFACT_RERANKER_MAX_CANDIDATES:-8}
  ARTIFACT_RETENTION_DAYS: ${ARTIFACT_RETENTION_DAYS:-30}
  ARTIFACT_TASK_NAME: ${ARTIFACT_TASK_NAME:-rag.artifact_jobs.tasks.generate_artifact_job}
  ARTIFACT_WORKER_TIMEOUT_SECONDS: ${ARTIFACT_WORKER_TIMEOUT_SECONDS:-1800}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agenticrag}
      POSTGRES_USER: ${POSTGRES_USER:-agenticrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agenticrag-local-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    entrypoint: ["sh", "/usr/local/bin/redis-recovery-entrypoint.sh"]
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-agenticrag-local-redis-password}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-agenticrag-local-redis-password}
      REDIS_AOF_RECOVERY: ${REDIS_AOF_RECOVERY:-repair}
    volumes:
      - redis-data:/data
      - ./deploy/redis/entrypoint.sh:/usr/local/bin/redis-recovery-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_BROWSER: "on"
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-agenticrag}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-agenticrag-local-minio-password}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.6
    restart: unless-stopped
    user: "0:0"
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-agenticrag-local-neo4j-password}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_allowlist: gds.*
      NEO4J_dbms_security_procedures_unrestricted: gds.*
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" \"RETURN 1\""]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 20

  clamav:
    image: clamav/clamav-debian:stable
    restart: unless-stopped
    environment:
      CLAMAV_NO_FRESHCLAMD: ${CLAMAV_NO_FRESHCLAMD:-true}
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=1 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 10

  vllm-text:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    profiles: ["vllm"]
    ipc: host
    runtime: nvidia
    gpus: all
    environment:
      AIRGAP_RUNTIME_OFFLINE: ${AIRGAP_RUNTIME_OFFLINE:-1}
      DO_NOT_TRACK: ${DO_NOT_TRACK:-1}
      HF_DATASETS_OFFLINE: ${HF_DATASETS_OFFLINE:-1}
      HF_HOME: /models/huggingface
      HF_HUB_DISABLE_TELEMETRY: ${HF_HUB_DISABLE_TELEMETRY:-1}
      HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      HF_TOKEN: ${HF_TOKEN:-}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
    command:
      - "${VLLM_CHAT_MODEL:-Qwen/Qwen3-8B-AWQ}"
      - --served-model-name
      - "${VLLM_CHAT_MODEL:-Qwen/Qwen3-8B-AWQ}"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - auto
      - --max-model-len
      - "${VLLM_TEXT_MAX_MODEL_LEN:-4096}"
      - --gpu-memory-utilization
      - "${VLLM_TEXT_GPU_MEMORY_UTILIZATION:-0.12}"
      - --kv-cache-memory-bytes
      - "${VLLM_TEXT_KV_CACHE_MEMORY_BYTES:-2G}"
      - --max-num-seqs
      - "${VLLM_TEXT_MAX_NUM_SEQS:-1}"
      - --max-num-batched-tokens
      - "${VLLM_TEXT_MAX_NUM_BATCHED_TOKENS:-4096}"
    ports:
      - "127.0.0.1:${VLLM_TEXT_PORT:-8010}:8000"
    volumes:
      - *vllm-cache-volume
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/v1/models\", timeout=5)'"]
      interval: 10s
      timeout: 10s
      start_period: 20m
      retries: 120

  vllm-embeddings:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    profiles: ["vllm"]
    ipc: host
    runtime: nvidia
    gpus: all
    environment:
      AIRGAP_RUNTIME_OFFLINE: ${AIRGAP_RUNTIME_OFFLINE:-1}
      DO_NOT_TRACK: ${DO_NOT_TRACK:-1}
      HF_DATASETS_OFFLINE: ${HF_DATASETS_OFFLINE:-1}
      HF_HOME: /models/huggingface
      HF_HUB_DISABLE_TELEMETRY: ${HF_HUB_DISABLE_TELEMETRY:-1}
      HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      HF_TOKEN: ${HF_TOKEN:-}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
    command:
      - nomic-ai/nomic-embed-text-v1.5
      - --served-model-name
      - nomic-ai/nomic-embed-text-v1.5
      - --runner
      - pooling
      - --convert
      - embed
      - --trust-remote-code
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - auto
      - --max-model-len
      - "${VLLM_EMBED_MAX_MODEL_LEN:-2048}"
      - --gpu-memory-utilization
      - "${VLLM_EMBED_GPU_MEMORY_UTILIZATION:-0.05}"
      - --max-num-seqs
      - "${VLLM_EMBED_MAX_NUM_SEQS:-2}"
      - --max-num-batched-tokens
      - "${VLLM_EMBED_MAX_NUM_BATCHED_TOKENS:-2048}"
    ports:
      - "127.0.0.1:${VLLM_EMBED_PORT:-8011}:8000"
    volumes:
      - *vllm-cache-volume
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/v1/models\", timeout=5)'"]
      interval: 10s
      timeout: 10s
      start_period: 20m
      retries: 120

  vllm-vision:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    profiles: ["vllm"]
    ipc: host
    runtime: nvidia
    gpus: all
    environment:
      AIRGAP_RUNTIME_OFFLINE: ${AIRGAP_RUNTIME_OFFLINE:-1}
      DO_NOT_TRACK: ${DO_NOT_TRACK:-1}
      HF_DATASETS_OFFLINE: ${HF_DATASETS_OFFLINE:-1}
      HF_HOME: /models/huggingface
      HF_HUB_DISABLE_TELEMETRY: ${HF_HUB_DISABLE_TELEMETRY:-1}
      HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      HF_TOKEN: ${HF_TOKEN:-}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
    command:
      - "${VLLM_VISION_MODEL_ID:-Qwen/Qwen2.5-VL-7B-Instruct-AWQ}"
      - --served-model-name
      - "${VLLM_VISION_MODEL_ID:-Qwen/Qwen2.5-VL-7B-Instruct-AWQ}"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - auto
      - --max-model-len
      - "${VLLM_VISION_MAX_MODEL_LEN:-2048}"
      - --gpu-memory-utilization
      - "${VLLM_VISION_GPU_MEMORY_UTILIZATION:-0.10}"
      - --kv-cache-memory-bytes
      - "${VLLM_VISION_KV_CACHE_MEMORY_BYTES:-2G}"
      - --max-num-seqs
      - "${VLLM_VISION_MAX_NUM_SEQS:-1}"
      - --max-num-batched-tokens
      - "${VLLM_VISION_MAX_NUM_BATCHED_TOKENS:-2048}"
      - --limit-mm-per-prompt
      - '{"image":1}'
    ports:
      - "127.0.0.1:${VLLM_VISION_PORT:-8016}:8000"
    volumes:
      - *vllm-cache-volume
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/v1/models\", timeout=5)'"]
      interval: 10s
      timeout: 10s
      start_period: 20m
      retries: 120

  deployment-controller:
    image: agenticrag-deployment-controller
    build:
      context: ./backend
      dockerfile: apps/deployment_controller/Dockerfile
    restart: unless-stopped
    profiles: ["vllm"]
    user: "0:0"
    command: ["python", "-m", "apps.deployment_controller.main"]
    environment:
      DEPLOYMENT_ALLOWED_SERVICES: vllm-text,vllm-embeddings,vllm-vision
      DEPLOYMENT_COMPOSE_FILE: /workspace/docker-compose.yml
      DEPLOYMENT_COMPOSE_PROJECT_DIR: /workspace
      DEPLOYMENT_COMPOSE_PROJECT_NAME: agenticrag
      DEPLOYMENT_COMPOSE_TIMEOUT_SECONDS: ${DEPLOYMENT_COMPOSE_TIMEOUT_SECONDS:-900}
      DEPLOYMENT_CONTROLLER_TOKEN: ${DEPLOYMENT_CONTROLLER_TOKEN:-replace-with-local-deployment-controller-token}
      PORT: 8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace:ro
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8080/health/ready\", timeout=2)'"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5

  api:
    image: agenticrag-api
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: apps/api/Dockerfile
      args:
        PREWARM_FASTEMBED: ${PREWARM_FASTEMBED:-false}
    environment:
      <<: [*backend-env, *artifact-env]
      ACCESS_COOKIE_NAME: ${ACCESS_COOKIE_NAME:-agenticrag_access_token}
      ADMIN_SERVICE_URL: ${ADMIN_SERVICE_URL:-http://api:8000}
      EVALUATION_DIAGNOSTIC_TOP_K: ${EVALUATION_DIAGNOSTIC_TOP_K:-10}
      EVALUATION_QUEUE_BACKEND: ${EVALUATION_QUEUE_BACKEND:-celery}
      EVALUATION_QUEUE_NAME: ${EVALUATION_QUEUE_NAME:-evaluation:jobs}
      EVALUATION_RETENTION_DAYS: ${EVALUATION_RETENTION_DAYS:-30}
      EVALUATION_TASK_NAME: ${EVALUATION_TASK_NAME:-rag.evaluations.tasks.run_evaluation}
      FOLDER_SCHEDULER_INTERVAL_SECONDS: ${FOLDER_SCHEDULER_INTERVAL_SECONDS:-60}
      FOLDER_SNAPSHOT_MAX_BYTES: ${FOLDER_SNAPSHOT_MAX_BYTES:-5368709120}
      FOLDER_SNAPSHOT_MAX_FILES: ${FOLDER_SNAPSHOT_MAX_FILES:-100}
      INGEST_QUEUE_BACKEND: ${INGEST_QUEUE_BACKEND:-celery}
      INGEST_QUEUE_NAME: ${INGEST_QUEUE_NAME:-ingest:jobs}
      INGEST_TASK_NAME: ${INGEST_TASK_NAME:-apps.ingestion.tasks.ingest_document}
      PORT: 8000
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-agenticrag_refresh_token}
      SERVICE_NAME: api
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - *fastembed-cache-volume
      - *folder-sources-volume
      - local-upload-data:${UPLOAD_STORAGE_DIR:-/var/lib/agenticrag/uploads}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy
      clamav:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health/ready\", timeout=8)'"]
      interval: 10s
      timeout: 10s
      start_period: 5s
      retries: 5

  query-api:
    image: agenticrag-api
    restart: unless-stopped
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: [*backend-env, *artifact-env]
      ACCESS_COOKIE_NAME: ${ACCESS_COOKIE_NAME:-agenticrag_access_token}
      ADMIN_SERVICE_URL: ${ADMIN_SERVICE_URL:-http://api:8000}
      EVALUATION_DIAGNOSTIC_TOP_K: ${EVALUATION_DIAGNOSTIC_TOP_K:-10}
      EVALUATION_QUEUE_BACKEND: ${EVALUATION_QUEUE_BACKEND:-celery}
      EVALUATION_QUEUE_NAME: ${EVALUATION_QUEUE_NAME:-evaluation:jobs}
      EVALUATION_RETENTION_DAYS: ${EVALUATION_RETENTION_DAYS:-30}
      EVALUATION_TASK_NAME: ${EVALUATION_TASK_NAME:-rag.evaluations.tasks.run_evaluation}
      FOLDER_SCHEDULER_INTERVAL_SECONDS: ${FOLDER_SCHEDULER_INTERVAL_SECONDS:-60}
      FOLDER_SNAPSHOT_MAX_BYTES: ${FOLDER_SNAPSHOT_MAX_BYTES:-5368709120}
      FOLDER_SNAPSHOT_MAX_FILES: ${FOLDER_SNAPSHOT_MAX_FILES:-100}
      INGEST_QUEUE_BACKEND: ${INGEST_QUEUE_BACKEND:-celery}
      INGEST_QUEUE_NAME: ${INGEST_QUEUE_NAME:-ingest:jobs}
      INGEST_TASK_NAME: ${INGEST_TASK_NAME:-apps.ingestion.tasks.ingest_document}
      PORT: 8000
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-agenticrag_refresh_token}
      SERVICE_NAME: query-api
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - *fastembed-cache-volume
      - *folder-sources-volume
      - local-upload-data:${UPLOAD_STORAGE_DIR:-/var/lib/agenticrag/uploads}
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy
      clamav:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health/ready\", timeout=8)'"]
      interval: 10s
      timeout: 10s
      start_period: 5s
      retries: 5

  artifact-worker:
    image: agenticrag-api
    restart: unless-stopped
    command: ["celery", "-A", "apps.workers.artifact.celery_app", "worker", "--loglevel=INFO", "--queues=${ARTIFACT_QUEUE_NAME:-artifact:jobs}"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A apps.workers.artifact.celery_app inspect ping --destination=celery@$${HOSTNAME} --timeout=2 >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    environment:
      <<: [*backend-env, *artifact-env]
      SERVICE_KIND: artifact-generation-worker-celery
      SERVICE_NAME: artifact-worker
    volumes:
      - *fastembed-cache-volume
      - local-upload-data:${UPLOAD_STORAGE_DIR:-/var/lib/agenticrag/uploads}
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started

  artifact-maintenance:
    image: agenticrag-api
    restart: unless-stopped
    command: ["python", "-m", "apps.background.artifact_cleanup", "--loop"]
    healthcheck:
      test: ["CMD-SHELL", "python -m apps.background.watchdog $$((3 * ARTIFACT_MAINTENANCE_INTERVAL_SECONDS))"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    environment:
      <<: [*backend-env, *artifact-env]
      SERVICE_KIND: artifact-maintenance
      SERVICE_NAME: artifact-maintenance
    volumes:
      - local-upload-data:${UPLOAD_STORAGE_DIR:-/var/lib/agenticrag/uploads}
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  ingestion-worker:
    image: agenticrag-ingestion-worker
    restart: unless-stopped
    command: ["celery", "-A", "apps.workers.document_pipeline.celery_app", "worker", "--loglevel=info", "--hostname=ingestion-worker@%h", "--queues=${INGEST_QUEUE_NAME:-ingest:jobs}"]
    build:
      context: ./backend
      dockerfile: apps/workers/document_pipeline/Dockerfile
      args:
        PREWARM_FASTEMBED: ${PREWARM_FASTEMBED:-false}
        PREWARM_DOCLING: ${PREWARM_DOCLING:-false}
    environment: &ingestion-worker-env
      <<: *backend-env
      DOCLING_ARTIFACTS_PATH: /models/docling
      DOCLING_CONVERT_TIMEOUT_SECONDS:
      DOCLING_OCR_BACKEND:
      DOCLING_OCR_LANGS:
      HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}
      INGEST_HEARTBEAT_INTERVAL_SECONDS:
      INGEST_QUEUE_NAME: ${INGEST_QUEUE_NAME:-ingest:jobs}
      INGEST_TASK_NAME: ${INGEST_TASK_NAME:-apps.ingestion.tasks.ingest_document}
      INGEST_STALE_AFTER_SECONDS:
      INGESTION_QUALITY_PRESET:
      GRAPHRAG_QUEUE_NAME: ${GRAPHRAG_QUEUE_NAME:-graphrag:jobs}
      INGEST_TASK_SOFT_TIME_LIMIT_SECONDS:
      INGEST_TASK_TIME_LIMIT_SECONDS:
      INGEST_WORKER_BOOT_CONCURRENCY:
      LAYERED_DOCLING_BATCH_PAGES:
      LAYERED_DOCLING_MAX_PAGES:
      METADATA_TOPIC_TAXONOMY:
      METADATA_USE_GLINER:
      MOCK_EMBEDDINGS:
      MOCK_LLM:
      MOCK_OCR:
      NATIVE_TEXT_MIN_CHARS_PER_PAGE:
      OCR_REVIEW_CONFIDENCE_THRESHOLD:
      OLLAMA_EMBED_BATCH_SIZE:
      OLLAMA_RETRY_BASE_SECONDS:
      PDF_FULL_DOC_WEAK_PAGE_RATIO:
      PDF_IMAGE_ANALYSIS_MAX_IMAGES:
      PDF_IMAGE_ANALYSIS_MAX_FULL_PAGE_FALLBACKS:
      PDF_IMAGE_REVIEW_THRESHOLD:
      PDF_WEAK_PAGE_THRESHOLD:
      SCANNED_VISUAL_REGION_ENABLED:
      SCANNED_VISUAL_MIN_AREA_RATIO:
      SCANNED_VISUAL_MAX_REGIONS_PER_PAGE:
      SCANNED_VISUAL_TEXT_MASK_PADDING_PX:
      QDRANT_UPSERT_BATCH_SIZE:
      RAG_CHUNK_MAX_CHARS:
      RAG_CHUNK_OVERLAP_CHARS:
      RAG_CHUNK_OVERLAP_TOKENS:
      RAG_CHUNK_TARGET_TOKENS:
      RAG_PARENT_MAX_TOKENS:
      SERVICE_KIND: rag-ingestion-worker-celery
      SERVICE_NAME: ingestion-worker
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - *fastembed-cache-volume
      - *docling-cache-volume
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A apps.workers.document_pipeline.celery_app inspect ping --destination=ingestion-worker@$${HOSTNAME} --timeout=2 >/dev/null && python -m rag.shared.model_cache_health --fastembed --docling"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  graphrag-worker:
    image: agenticrag-ingestion-worker
    restart: unless-stopped
    command: ["celery", "-A", "apps.workers.document_pipeline.celery_app", "worker", "--loglevel=info", "--hostname=graphrag-worker@%h", "--queues=${GRAPHRAG_QUEUE_NAME:-graphrag:jobs}"]
    environment:
      <<: *ingestion-worker-env
      INGEST_TASK_SOFT_TIME_LIMIT_SECONDS: ${GRAPHRAG_TASK_SOFT_TIME_LIMIT_SECONDS:-3600}
      INGEST_TASK_TIME_LIMIT_SECONDS: ${GRAPHRAG_TASK_TIME_LIMIT_SECONDS:-3900}
      INGEST_WORKER_BOOT_CONCURRENCY: ${GRAPHRAG_WORKER_BOOT_CONCURRENCY:-1}
      SERVICE_KIND: rag-graphrag-worker-celery
      SERVICE_NAME: graphrag-worker
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - *fastembed-cache-volume
      - *docling-cache-volume
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A apps.workers.document_pipeline.celery_app inspect ping --destination=graphrag-worker@$${HOSTNAME} --timeout=2 >/dev/null && python -m rag.shared.model_cache_health --fastembed"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  docling-prewarm:
    image: agenticrag-ingestion-worker
    profiles: ["prewarm"]
    command: ["python", "-m", "rag.ingestion.ops.prewarm_docling"]
    environment:
      DOCLING_ARTIFACTS_PATH: /models/docling
      DOCLING_OCR_BACKEND: ${DOCLING_OCR_BACKEND:-onnxruntime}
      DOCLING_OCR_LANGS: ${DOCLING_OCR_LANGS:-english}
      AIRGAP_RUNTIME_OFFLINE: "0"
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
      HF_DATASETS_OFFLINE: "0"
      HF_HUB_DISABLE_TELEMETRY: ${HF_HUB_DISABLE_TELEMETRY:-1}
      HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}
      DO_NOT_TRACK: ${DO_NOT_TRACK:-1}
    volumes:
      - *docling-cache-volume

  evaluation-worker:
    image: agenticrag-api
    restart: unless-stopped
    command: ["celery", "-A", "apps.workers.evaluation.celery_app", "worker", "--loglevel=INFO", "--queues=${EVALUATION_QUEUE_NAME:-evaluation:jobs}"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A apps.workers.evaluation.celery_app inspect ping --destination=celery@$${HOSTNAME} --timeout=2 >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    environment:
      <<: *backend-env
      EVALUATION_DIAGNOSTIC_TOP_K: ${EVALUATION_DIAGNOSTIC_TOP_K:-10}
      EVALUATION_QUEUE_NAME: ${EVALUATION_QUEUE_NAME:-evaluation:jobs}
      EVALUATION_RETENTION_DAYS: ${EVALUATION_RETENTION_DAYS:-30}
      EVALUATION_TASK_NAME: ${EVALUATION_TASK_NAME:-rag.evaluations.tasks.run_evaluation}
      EVALUATION_WORKER_TIMEOUT_SECONDS: ${EVALUATION_WORKER_TIMEOUT_SECONDS:-3600}
      RAG_DEFER_FAITHFULNESS: ${RAG_DEFER_FAITHFULNESS:-true}
      RAG_SESSION_PREFIX: ${RAG_SESSION_PREFIX:-rag:session}
      RAG_SESSION_STORE: ${RAG_SESSION_STORE:-redis}
      SERVICE_KIND: rag-evaluation-worker-celery
      SERVICE_NAME: evaluation-worker
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - *fastembed-cache-volume
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  folder-scheduler:
    image: agenticrag-api
    restart: unless-stopped
    command: ["python", "-m", "apps.background.folder_ingestion_scheduler", "--loop"]
    healthcheck:
      test: ["CMD-SHELL", "python -m apps.background.watchdog $$((3 * FOLDER_SCHEDULER_INTERVAL_SECONDS))"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    environment:
      <<: *backend-env
      FOLDER_SCHEDULER_INTERVAL_SECONDS: ${FOLDER_SCHEDULER_INTERVAL_SECONDS:-60}
      INGEST_QUEUE_BACKEND: ${INGEST_QUEUE_BACKEND:-celery}
      INGEST_QUEUE_NAME: ${INGEST_QUEUE_NAME:-ingest:jobs}
      INGEST_TASK_NAME: ${INGEST_TASK_NAME:-apps.ingestion.tasks.ingest_document}
      SERVICE_KIND: scheduled-folder-ingestion-dispatcher
      SERVICE_NAME: folder-scheduler
    volumes:
      - *folder-sources-volume
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  ingest-maintenance:
    image: agenticrag-api
    restart: unless-stopped
    command: ["python", "-m", "apps.background.ingestion_maintenance", "--loop"]
    healthcheck:
      test: ["CMD-SHELL", "python -m apps.background.watchdog $$((3 * INGEST_MAINTENANCE_INTERVAL_SECONDS))"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    environment:
      <<: *backend-env
      INGEST_MAINTENANCE_INTERVAL_SECONDS: ${INGEST_MAINTENANCE_INTERVAL_SECONDS:-30}
      INGEST_QUEUE_BACKEND: ${INGEST_QUEUE_BACKEND:-celery}
      INGEST_QUEUE_NAME: ${INGEST_QUEUE_NAME:-ingest:jobs}
      INGEST_STALE_AFTER_SECONDS: ${INGEST_STALE_AFTER_SECONDS:-120}
      INGEST_TASK_NAME: ${INGEST_TASK_NAME:-apps.ingestion.tasks.ingest_document}
      INGEST_WORKER_BOOT_CONCURRENCY: ${INGEST_WORKER_BOOT_CONCURRENCY:-1}
      SERVICE_KIND: ingestion-recovery-and-capacity-controller
      SERVICE_NAME: ingest-maintenance
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: agenticrag-frontend
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_POLLING_INTERVAL_MS: ${VITE_POLLING_INTERVAL_MS:-2000}
    environment:
      SERVICE_NAME: frontend
    ports:
      - "0.0.0.0:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
        restart: true
      query-api:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  local-upload-data:
  minio-data:
  postgres-data:
  qdrant-data:
  neo4j-data:
  redis-data:
