[project]
name = "agenticrag-rag-ingestion-worker"
version = "0.0.0"
description = "AgenticRAG native PDF ingestion worker."
requires-python = ">=3.11"
dependencies = [
    "celery[redis]==5.6.3",
    "fastembed==0.8.0",
    "minio==7.2.20",
    "neo4j>=6,<7",
    "docling==2.97.0",
    "pillow>=10,<13",
    "PyMuPDF==1.27.2.3",
    "pymupdf-layout==1.27.2.3",
    "dateparser>=1.2,<2",
    "langdetect>=1.0,<2",
    "numpy==2.4.4",
    "onnxruntime==1.26.0",
    "pydantic==2.13.4",
    "torch==2.12.0",
    "torchvision==0.27.0",
]

[project.optional-dependencies]
metadata-ner = [
    "gliner>=0.2,<1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
